name: CI

on:
  push:
    branches: [main]
  pull_request:

# The shell key does not accept the matrix context, so each shell gets its own
# pair of steps, selected with an if condition.
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
          - os: ubuntu-latest
            shell: pwsh
          - os: macos-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./.github/install-dev-tools.ps1

      - name: Install Pester and PSScriptAnalyzer (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./.github/install-dev-tools.ps1

      - name: Lint, manifest, tests (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./build.ps1 -CI

      - name: Lint, manifest, tests (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./build.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: TestResults/results.xml
