name: Publish to PowerShell Gallery

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $manifest = Test-ModuleManifest -Path ./MailHeaderAnalyzer/MailHeaderAnalyzer.psd1
          if ($manifest.Version.ToString() -ne $tag) {
            throw "Tag v$tag does not match ModuleVersion $($manifest.Version)."
          }

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: ./.github/install-dev-tools.ps1

      - name: Lint, manifest, tests
        shell: pwsh
        run: ./build.ps1 -CI

      - name: Publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'Secret PSGALLERY_API_KEY is not set.' }
          Publish-Module -Path ./MailHeaderAnalyzer -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
